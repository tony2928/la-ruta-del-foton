<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1224">
  <title>Página no encontrada | Estudio y aplicación de la emisión láser</title>
  <style>
    :root {
      --navy: #0a1224;
      --laser: #e63946;
      --cyan: #22d3ee;
      --ink: #101a2b;
      --muted: #5b6577;
      --bg: #f7f5ef;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background:
        radial-gradient(circle at 15% 20%, rgba(34, 211, 238, .1), transparent 35%),
        radial-gradient(circle at 85% 10%, rgba(230, 57, 70, .14), transparent 30%),
        var(--navy);
      color: #fff;
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    }
    main {
      width: min(560px, 100%);
      padding: clamp(1.5rem, 5vw, 3rem);
      background: var(--bg);
      color: var(--ink);
      border-radius: 14px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .3);
    }
    .mark {
      width: 3.2rem;
      height: 3.2rem;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: rgba(230, 57, 70, .1);
      border: 1px solid rgba(230, 57, 70, .35);
      color: #b91c2a;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 1.2rem;
    }
    p.kicker {
      margin: 0 0 .5rem;
      color: #0e7490;
      font-size: .8rem;
      font-weight: 700;
    }
    h1 {
      margin: 0 0 .8rem;
      font-size: clamp(2rem, 8vw, 3rem);
      line-height: 1.05;
      letter-spacing: -.04em;
    }
    p {
      margin: 0 0 1.2rem;
      color: var(--muted);
      line-height: 1.6;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: .8rem 1.2rem;
      border-radius: 8px;
      background: #cf2332;
      color: #fff;
      font-weight: 750;
      text-decoration: none;
    }
    a:hover { background: #b91c2a; }
    a:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">λ</div>
    <p class="kicker">Error 404</p>
    <h1>Este fotón se perdió</h1>
    <p>La página que buscas no existe o cambió de dirección. Vuelve al inicio de <strong>Estudio y aplicación de la emisión láser</strong> para consultar el contenido.</p>
    <a href="/">Volver al inicio</a>
  </main>
</body>
</html>
